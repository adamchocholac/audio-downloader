app = 'adamchocholac-podcast'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'
  PODCAST_NAME = 'My YouTube Podcast'
  PODCAST_DESC = 'Audio downloaded from YouTube.'

# API_TOKEN must be set as a secret:
#   fly secrets set API_TOKEN=<your-random-token>

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'podcast_data'
  destination = '/data'
